name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'        # Only triggers when backend files change
      - 'render.yaml'
  workflow_dispatch:        # Also allows manual trigger from GitHub UI

jobs:
  # ── 1. Lint & basic checks ───────────────────────────────────────────────
  validate:
    name: Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for missing env vars in code
        run: |
          echo "Scanning for hardcoded secrets..."
          if grep -r "fallback_secret" backend/ --include="*.js"; then
            echo "❌ Found hardcoded fallback secrets!"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

  # ── 2. Deploy to Render ───────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: validate          # Only deploy if validate passes

    steps:
      - name: Trigger Render Deploy Hook
        # Set RENDER_DEPLOY_HOOK_URL in GitHub Secrets:
        # Render Dashboard → Your Service → Settings → Deploy Hook → Copy URL
        # GitHub → Repo Settings → Secrets → Actions → New secret
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -w "\nHTTP Status: %{http_code}\n"

      - name: Notify deploy triggered
        run: echo "✅ Render deploy hook triggered. Check Render dashboard for status."
